services:
  codebook:
    build: .
    image: elec-codebook-oo:local
    user: "10001:10001"
    volumes:
      - ./artifacts:/app/artifacts
      - ${CODEBOOK_SOURCE_DIR:-./examples/synthetic-codebook}:/books:ro
    command: doctor

  pgvector:
    profiles: ["pgvector"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: codebook_test
      POSTGRES_USER: codebook
      POSTGRES_PASSWORD: codebook-local-only
    ports:
      - "${CODEBOOK_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebook -d codebook_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - codebook-pgvector-data:/var/lib/postgresql/data

volumes:
  codebook-pgvector-data:
