name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: codebook_test
          POSTGRES_USER: codebook
          POSTGRES_PASSWORD: codebook-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codebook -d codebook_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,pdf,postgres]'
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          CODEBOOK_TEST_DATABASE_URL: postgresql://codebook:codebook-ci-only@127.0.0.1:5432/codebook_test
      - run: make dry
      - run: make smoke
      - run: make leak-check
      - run: git diff --check
