[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elec-codebook-oo"
version = "0.6.0"
description = "Evidence-preserving codebook ingestion with backend-neutral retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Elec Codebook OO contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
ocr = ["pypdf>=5.0", "pypdfium2>=4.30", "pillow>=10.0"]
ai = ["openai>=1.68.0"]
postgres = ["pgvector>=0.3.6", "psycopg[binary,pool]>=3.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
codebook = "codebook_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codebook_agent"]

[tool.hatch.build.targets.wheel.force-include]
"codebook_agent/backends/sql/001_pgvector.sql" = "codebook_agent/backends/sql/001_pgvector.sql"
"codebook_agent/data/synthetic_source.txt" = "codebook_agent/data/synthetic_source.txt"
"codebook_agent/profiles/generic-reference-template.json" = "codebook_agent/profiles/generic-reference-template.json"
"codebook_agent/profiles/nfpa70-reference-template.json" = "codebook_agent/profiles/nfpa70-reference-template.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "pgvector: requires a disposable real PostgreSQL database with the vector extension",
  "ocr: requires local Tesseract and exercises real image OCR",
]

[tool.ruff]
line-length = 100
target-version = "py311"
